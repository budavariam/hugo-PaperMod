<!-- inspiration: https://css-tricks.com/sticky-table-of-contents-with-scrolling-active-states/ -->
<script>
window.addEventListener('DOMContentLoaded', () => {
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      const id = entry.target.getAttribute('id');
      const listItems = document.querySelector(`#TableOfContents li a[href="#${id}"]`)
      if (!listItems) {
        return
      }
      if (entry.intersectionRatio > 0) {
        listItems.parentElement.classList.add('active');
      } else {
        listItems.parentElement.classList.remove('active');
      }
    });
  });

  // Track all sections that have an `id` applied
  document.querySelectorAll('.post-content section[id]').forEach((section) => {
    observer.observe(section);
  });

});
</script>
