<script defer src="//cdnjs.cloudflare.com/ajax/libs/timeago.js/2.0.2/timeago.min.js"></script>
<script>
  function createFunctionWithTimeout(callback, opt_timeout) {
    var called = false;
    function fn() {
      if (!called) {
        called = true;
        callback();
      }
    }
    setTimeout(fn, opt_timeout || 500);
    return fn;
  }

  window.addEventListener('DOMContentLoaded', () => {
    /// Add navigation to the recommendation block

    function scroll(direction) {
      const container = document.querySelector('.recommend-wrapper')
      const posts = document.querySelector('.recommend-posts')
      const postCount = posts.childElementCount
      const singleItemWidth = posts.offsetWidth / postCount
      let doubleWidth = 2 * singleItemWidth
      let duration = 700
      container.offsetWidth < doubleWidth && (doubleWidth = singleItemWidth, duration /= 2)
      // const i = container.scrollLeft + doubleWidth * direction
      // $(container).animate({ scrollLeft: i }, duration) // jquery
      const scrollBy = doubleWidth * direction
      container.scrollBy({ top: 0, left: scrollBy, behavior: 'smooth' })
    }

    const moveLeft = (e) => scroll(1)
    const rightNav = document.querySelector('.scroll-right');
    rightNav.addEventListener('click', moveLeft);

    const moveRight = (e) => scroll(-1)
    const leftNav = document.querySelector('.scroll-left');
    leftNav.addEventListener('click', moveRight);

    /// Calculate when was the post created dynamically

    const nodes = document.querySelectorAll('.timeago');
    const timeAgo = new window.timeago();
    timeAgo.render(nodes, 'en_US');
    // cancel all real-time render task
    timeAgo.cancel();

    const posts = document.querySelectorAll('.recommend-post');
    posts.forEach((post) => {
      function actionCallback() {
        window.open(post.dataset.link);
      }
      post.addEventListener('click', (e) => {
        if (!window.gtag) {
          actionCallback()
        } else {
          gtag('event', 'click_recommended', {
            'event_callback': () => {
              // Sends the event to Google Analytics and
              // redireect the user once the hit is done.
              createFunctionWithTimeout(actionCallback)
            }
          });
        }
      });
    })
  })
</script>

<div class="recommendations-layout" data-tracking-area="recommendations-layout">
  <div class="post-list" style="height: auto; visibility: visible;">
    <div class="recommendations-wrapper" style="width: 100%;">
      <div class="recommend-main  ">
        <section class="col-organic">
          <div class="recommendations-unit">
            <div class="recommendation-container">
              <button class="scroll-btn scroll-left" data-action="scroll-left" tabindex="-1">❮</button>
              <div class="recommend-wrapper">
                <div class="recommend-posts" data-role="recommend-posts">
                  {{ range $index, $Post := .Site.Taxonomies.featured.home }}
                  <div class="recommend-post post-{{ $index }}" data-role="recommended-post"
                    data-link="{{ $Post.Permalink }}" tabindex="0">
                    <header class="recommend-post-header">
                      <div class="recommend-image-wrapper">
                        {{ with .Resources.GetMatch "cover" }}
                        {{ $processedImg := .Fit "500x500" }}
                        <img src="data:{{ $processedImg.MediaType }};base64,{{ $processedImg.Content | base64Encode }}">
                        {{ end }}
                        <span class="overlay"></span>
                      </div>
                      <h3 class="recommend-post-title" title="{{$Post.Title}}">
                        <span data-role="recommend-thread-title" class="title line-truncate" data-line-truncate="3"
                          data-content="{{$Post.Title}}">{{$Post.Title}}</span>
                      </h3>
                    </header>
                    <ul class="meta">
                      <li class="time">
                        {{ with .Date.Format "2006-01-02 15:04:05Z07:00" }}
                        <div class="timeago" datetime="{{ . }}"></div>
                        {{end}}
                      </li>
                    </ul>
                    <div class="content-preview-wrapper">
                      <div class="recommend-content">
                        <span data-role="recommend-description-snippet" class="line-truncate" data-line-truncate="5">
                          {{ $Post.Summary | plainify | htmlUnescape }}...
                        </span>
                      </div>
                    </div>
                  </div>
                  {{ end}}
                </div>
              </div>
              <button class="scroll-btn scroll-right" data-action="scroll-right" tabindex="-1">❯</button>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
</div>
